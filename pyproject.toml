[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avito-monitor"
version = "0.1.0"
description = "Telegram-based Avito listing monitor with API polling and alert delivery"
authors = [{name = "Avito Monitor maintainers"}]
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.30,<4",
    "requests>=2.32.4",
    "aiohttp>=3.9.5",
    "beautifulsoup4>=4.12.3",
    "python-dotenv>=1.0.1",
    "curl-cffi>=0.13.0",
]

[tool.setuptools]
py-modules = [
    "avito_monitor_bot",
    "avito_monitoring",
    "avito_domain",
    "avito_settings",
    "alert_bot",
    "avito_api",
    "avito_pow",
    "avito_sitemap",
    "storage",
    "avito_ui",
    "avito_accounts",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3,<0.17",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.scripts]
avito-monitor = "avito_monitor_bot:run"
avito-alert = "alert_bot:run"
